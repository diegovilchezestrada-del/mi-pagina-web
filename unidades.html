<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades - Portafolio Académico</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<!-- CURSOR PERSONALIZADO -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<canvas id="bg-canvas"></canvas>
<div class="grid-overlay"></div>

<!-- NAVBAR -->
<header class="navbar">
    <div class="navbar-brand">
        <div class="brand-logo"><img src="LogoUpla.png" alt="UPLA"></div>
        <div class="brand-text">
            <span class="brand-title">Universidad Peruana Los Andes</span>
            <span class="brand-sub">Portafolio · Base de Datos II</span>
        </div>
    </div>
    <nav class="navbar-links">
        <a href="index.html">Inicio</a>
        <a href="#" class="activo">Unidad I</a>
        <a href="#" onclick="mostrarUnidad(2)">Unidad II</a>
        <a href="#" onclick="mostrarUnidad(3)">Unidad III</a>
        <a href="#" onclick="mostrarUnidad(4)">Unidad IV</a>
        <a href="index.html#sobre-mi">Sobre Mí</a>
    </nav>
    <div class="navbar-actions">
        <a href="login.html" class="btn-ingresar"><i class="fas fa-sign-in-alt"></i> Ingresar</a>
        <div class="avatar-circle">V</div>
    </div>
</header>

<div class="contenedor-unidades">
    <aside class="menu-unidades">
        <h2><i class="fas fa-book-open"></i> Unidades</h2>
        <button onclick="mostrarUnidad(1)" class="btn-unidad" id="btn-u1">
            <i class="fas fa-circle-dot"></i> Unidad 01
        </button>
        <button onclick="mostrarUnidad(2)" class="btn-unidad" id="btn-u2">
            <i class="fas fa-circle-dot"></i> Unidad 02
        </button>
        <button onclick="mostrarUnidad(3)" class="btn-unidad" id="btn-u3">
            <i class="fas fa-circle-dot"></i> Unidad 03
        </button>
        <button onclick="mostrarUnidad(4)" class="btn-unidad" id="btn-u4">
            <i class="fas fa-circle-dot"></i> Unidad 04
        </button>
        <div class="menu-footer">
            <button onclick="cerrarSesion()" class="btn-salir">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </aside>

    <main class="contenido-unidades">
        <h1 id="tituloUnidad">Unidad 01</h1>
        <div id="contenidoSemanas"></div>

        <!-- VISOR UNIFICADO (PDFs e Imágenes) -->
        <div id="visorPDF" class="visor-pdf-container" style="display:none;">
            <div class="visor-header">
                <div class="visor-titulo">
                    <i class="fas fa-file-pdf" id="visorIcono"></i>
                    <span id="visorTitulo">Informe Técnico</span>
                </div>
                <div class="visor-acciones">
                    <a id="btnDescargar" href="#" download class="btn-visor-accion">
                        <i class="fas fa-download"></i> Descargar
                    </a>
                    <button onclick="cerrarVisor()" class="btn-visor-cerrar">
                        <i class="fas fa-times"></i> Cerrar
                    </button>
                </div>
            </div>
            <!-- Visor PDF -->
            <iframe id="iframePDF" src="" class="visor-iframe"></iframe>
            <!-- Visor Imagen -->
            <img id="visorImagen" src="" class="visor-iframe" style="display:none; object-fit:contain; background:#000; width:100%; height:100%;">
        </div>
    </main>
</div>

<script>
// Fondo animado
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function createParticle() {
    return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.5 + 0.1,
        color: Math.random() > 0.5 ? '255,32,96' : '0,207,255'
    };
}

for (let i = 0; i < 150; i++) particles.push(createParticle());

function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > W) p.dx *= -1;
        if (p.y < 0 || p.y > H) p.dy *= -1;
    }
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            let d = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
            if (d < 100) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(255,32,96,${0.06 * (1 - d / 100)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(drawParticles);
}
drawParticles();

// ====================== CONTENIDO ======================
const pdfs = {
    // ── UNIDAD 1 ──
    'u1s1': {
        archivo: 'unidad01semana01.pdf',
        titulo: 'Informe Técnico Comparativo sobre Arquitecturas de Bases de Datos'
    },
    'u1s2': [
        { archivo: 'Analisis_Tecnico.pdf',           titulo: 'Análisis Técnico' },
        { archivo: 'Diagrama.pdf',                   titulo: 'Diagrama ER' },
        { archivo: 'Manual de Instalacion SQL.pdf',  titulo: 'Manual de Instalación SQL' }
    ],
    'u1s3': [
        { archivo: 'Arquitecturadebasededatos.pdf',                 titulo: 'Arquitectura de Base de Datos Relacional' },
        { archivo: 'Preguntas.pdf',                                  titulo: 'Preguntas' },
        { archivo: 'MODELADO Y NORMALIZACION DE BASE DE DATOS.pdf', titulo: 'Modelado y Normalización de BD' }
    ],
    'u1s4': [
        { archivo: 'ARQUITECTURA DE BASE DE DATOS .pdf', titulo: 'Arquitecturas de Base de Datos' },
        { archivo: 'MODELO .pdf',                        titulo: 'Modelo de Base de Datos' }
    ],

    // ── UNIDAD 2 ──
    
    'u2s1': [
        { archivo: 'tablasSQLserver.png',    titulo: 'Introducción a Microsoft SQL Server',        tipo: 'imagen'  },
        { archivo: 'Relación no Normalisada.png',        titulo: 'Relación no Normalisada',        tipo: 'imagen' },
        { archivo: '1ra Forma Normalisada.png',          titulo: '1ra Forma Normalisada',          tipo: 'imagen' },
        { archivo: '2da Forma Normalisada semana.png',    titulo: '2da Forma Normalisada ',    tipo: 'imagen' },
        { archivo: '3ra Forma Normalisada.png',           titulo: '3ra Forma Normalisada',           tipo: 'imagen' }
    ]
};

let unidadActual = 1;

function mostrarUnidad(num) {
    unidadActual = num;
    cerrarVisor();

    for (let i = 1; i <= 4; i++) {
        document.getElementById(`btn-u${i}`).classList.remove('activo');
    }
    document.getElementById(`btn-u${num}`).classList.add('activo');

    document.getElementById("tituloUnidad").innerText = `Unidad ${num.toString().padStart(2, '0')}`;
    generarSemanas(num);
}

function generarSemanas(unidadNum) {
    const contenedor = document.getElementById("contenidoSemanas");
    contenedor.innerHTML = "";

    for (let i = 1; i <= 4; i++) {
        const key = `u${unidadNum}s${i}`;
        const data = pdfs[key];
        const tienePDF = data !== undefined;
        const esArray = Array.isArray(data);
        const semanaStr = i.toString().padStart(2, '0');

        let botonesHTML = '';
        if (tienePDF) {
            if (esArray) {
                botonesHTML = data.map((item, idx) => {
                    const esImagen = item.tipo === 'imagen';
                    const icono = esImagen ? 'fa-image' : 'fa-eye';
                    return `
                        <button onclick="abrirVisor('${key}', ${idx})" class="btn-semana" style="margin-bottom:6px;">
                            <i class="fas ${icono}"></i> ${item.titulo}
                        </button>
                    `;
                }).join('');
            } else {
                botonesHTML = `
                    <button onclick="abrirVisor('${key}', -1)" class="btn-semana">
                        <i class="fas fa-eye"></i> Ver Semana ${semanaStr}
                    </button>
                `;
            }
        } else {
            botonesHTML = `
                <button class="btn-semana btn-semana-disabled" disabled>
                    <i class="fas fa-lock"></i> Sin contenido aún
                </button>
            `;
        }

        // Contar PDFs e imágenes por separado para el texto descriptivo
        let descripcionArchivos = '';
        if (tienePDF) {
            if (esArray) {
                const numPDFs    = data.filter(d => d.tipo !== 'imagen').length;
                const numImages  = data.filter(d => d.tipo === 'imagen').length;
                const partes = [];
                if (numPDFs   > 0) partes.push(`${numPDFs} PDF(s)`);
                if (numImages > 0) partes.push(`${numImages} imagen(es)`);
                descripcionArchivos = partes.join(' · ');
            } else {
                descripcionArchivos = data.titulo;
            }
        } else {
            descripcionArchivos = 'Informe Técnico';
        }

        contenedor.innerHTML += `
            <div class="semana">
                <div class="semana-header">
                    <h3><i class="fas fa-calendar-week"></i> Semana ${semanaStr}</h3>
                    ${tienePDF
                        ? '<span class="badge-disponible"><i class="fas fa-check-circle"></i> Disponible</span>'
                        : '<span class="badge-pronto"><i class="fas fa-clock"></i> Próximamente</span>'}
                </div>
                <p class="estado-archivo">
                    <i class="fas fa-file-alt"></i> ${descripcionArchivos}
                </p>
                ${botonesHTML}
            </div>
        `;
    }
}

function abrirVisor(key, idx) {
    const data = pdfs[key];
    if (!data) return;

    const item = Array.isArray(data) ? data[idx] : data;
    const esImagen = item.tipo === 'imagen';

    document.getElementById('visorTitulo').textContent = item.titulo;
    document.getElementById('btnDescargar').href = item.archivo;

    const iframe  = document.getElementById('iframePDF');
    const img     = document.getElementById('visorImagen');
    const icono   = document.getElementById('visorIcono');

    if (esImagen) {
        // Mostrar imagen, ocultar iframe
        iframe.style.display = 'none';
        iframe.src = '';
        img.src = item.archivo;
        img.style.display = 'block';
        icono.className = 'fas fa-image';
    } else {
        // Mostrar iframe PDF, ocultar imagen
        img.style.display = 'none';
        img.src = '';
        iframe.src = item.archivo;
        iframe.style.display = 'block';
        icono.className = 'fas fa-file-pdf';
    }

    const visor = document.getElementById('visorPDF');
    visor.style.display = 'flex';
    visor.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cerrarVisor() {
    const visor = document.getElementById('visorPDF');
    visor.style.display = 'none';
    document.getElementById('iframePDF').src = '';
    document.getElementById('visorImagen').src = '';
    document.getElementById('visorImagen').style.display = 'none';
    document.getElementById('iframePDF').style.display = 'block';
}

function cerrarSesion() {
    localStorage.removeItem("usuario");
    alert("Sesión cerrada");
    window.location.href = "login.html";
}

window.onload = () => mostrarUnidad(1);

// ====================== CURSOR PERSONALIZADO ======================
const dot = document.getElementById('cursorDot');
const ring = document.getElementById('cursorRing');

const cursorColors = [
    { dot: '#ff2060', ring: 'rgba(255,32,96,0.55)'  },
    { dot: '#00cfff', ring: 'rgba(0,207,255,0.55)'  },
    { dot: '#cc00ff', ring: 'rgba(200,0,255,0.55)'  },
    { dot: '#ffffff', ring: 'rgba(255,255,255,0.4)' },
    { dot: '#ff8c00', ring: 'rgba(255,140,0,0.55)'  },
    { dot: '#00ffb3', ring: 'rgba(0,255,179,0.45)'  },
];

let colorIdx = 0, trailTimer = 0, mx = 0, my = 0, rx = 0, ry = 0;

function applyColor(idx) {
    const c = cursorColors[idx];
    dot.style.background   = c.dot;
    dot.style.boxShadow    = `0 0 12px ${c.dot}, 0 0 24px ${c.dot}`;
    ring.style.borderColor = c.ring;
    ring.style.boxShadow   = `0 0 10px ${c.ring}`;
}
applyColor(0);
setInterval(() => { colorIdx = (colorIdx + 1) % cursorColors.length; applyColor(colorIdx); }, 1200);

document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    trailTimer++;
    if (trailTimer % 3 === 0) {
        const trail = document.createElement('div');
        trail.className = 'cursor-trail';
        const c = cursorColors[colorIdx];
        const size = Math.random() * 6 + 3;
        trail.style.cssText = `left:${mx}px;top:${my}px;width:${size}px;height:${size}px;background:${c.dot};box-shadow:0 0 8px ${c.dot};opacity:.7;`;
        document.body.appendChild(trail);
        setTimeout(() => trail.remove(), 650);
    }
});

function animateRing() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animateRing);
}
animateRing();

document.querySelectorAll('a, button, [onclick], input, label, .btn-unidad, .btn-semana, .btn-salir, .btn-ingresar, .avatar-circle').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cur-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cur-hover'));
});
document.addEventListener('mousedown', () => document.body.classList.add('cur-click'));
document.addEventListener('mouseup',   () => document.body.classList.remove('cur-click'));
document.addEventListener('mouseleave', () => { dot.style.opacity = '0'; ring.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { dot.style.opacity = '1'; ring.style.opacity = '1'; });
</script>
</body>
</html>
